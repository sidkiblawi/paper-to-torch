[project]
name = "paper-to-torch"
version = "0.1.0"
description = "Practice turning equations from ML papers into PyTorch code."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[dependency-groups]
dev = ["nbformat", "nbclient"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p2t"]
